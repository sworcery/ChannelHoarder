name: Build image

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild so the image picks up the latest yt-dlp even without a code push.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Gitea Actions only (GitHub ignores .gitea/). The GitHub workflow in
# .github/workflows is gated to github.com, so Gitea skips it. No tests run
# here; the local suite is the gate.
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Compare the push's before/after SHAs by hand. workflow_dispatch and
      # schedule have no "before", and a first push or force push has a
      # null/all-zero one, so those always build.
      - name: Detect relevant changes
        id: filter
        run: |
          set -e
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=${{ github.event_name }} always builds" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          ZERO="0000000000000000000000000000000000000000"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=no usable previous commit - building to be safe" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --quiet exits 1 on a difference and >1 on an error; both build.
          if ! git diff --quiet "$BEFORE" "$AFTER" -- backend/ frontend/ docker/ tools/ .gitea/workflows/build.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=relevant paths changed" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reason=no relevant paths changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.filter.outputs.changed != 'true'
        run: echo "::notice::Skipping build - ${{ steps.filter.outputs.reason }}"

      # The registry is this Gitea instance, so its host comes from the server
      # URL rather than being written into a public repo.
      - name: Read version and registry
        id: meta
        if: steps.filter.outputs.changed == 'true'
        run: |
          echo "ver=$(sed -n 's/^ *APP_VERSION: str = "\(.*\)"$/\1/p' backend/app/config.py)" >> "$GITHUB_OUTPUT"
          host="${GITHUB_SERVER_URL#*://}"
          echo "registry=${host%/}" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The job's docker.sock is the runner host's daemon, so this tag lands
      # in its local image store directly. Only :latest is kept there; no
      # per-version or per-commit tags pile up. CACHEBUST forces the yt-dlp
      # layer to rebuild every run (see docker/Dockerfile).
      - name: Build image
        if: steps.filter.outputs.changed == 'true'
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build -f docker/Dockerfile \
            --build-arg CACHEBUST="$(date +%s)" \
            -t channelhoarder:latest \
            .
          docker images channelhoarder

      # Publish only on a release (:v<version> not in the registry yet) or a
      # manual run. Every other push or scheduled rebuild stays local. A probe
      # that fails for any other reason does not publish. No REGISTRY_TOKEN
      # means no publishing at all.
      - name: Release check
        id: registry
        if: steps.filter.outputs.changed == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
        run: |
          set +e
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"; echo "REGISTRY_TOKEN not set - not publishing"; exit 0
          fi
          owner="${{ steps.meta.outputs.owner }}"
          tag="v${{ steps.meta.outputs.ver }}"
          if [ "$tag" = "v" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"; echo "No version found - not publishing"; exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -I -u "${REGISTRY_USER:-$owner}:$REGISTRY_TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "${GITHUB_SERVER_URL%/}/v2/$owner/channelhoarder/manifests/$tag")
          if [ "$code" = "404" ]; then push=true; newver=true
          elif [ "$code" = "200" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then push=true; newver=false
          else push=false; newver=false; fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "newver=$newver" >> "$GITHUB_OUTPUT"
          echo "$tag registry probe: HTTP $code -> publish=$push"

      - name: Log in to Gitea registry
        if: steps.filter.outputs.changed == 'true' && steps.registry.outputs.push == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
        run: echo "$REGISTRY_TOKEN" | docker login "${{ steps.meta.outputs.registry }}" -u "${REGISTRY_USER:-${{ steps.meta.outputs.owner }}}" --password-stdin

      # :latest moves on every publish. :v<version> is pushed once, on the
      # release, and never replaced.
      - name: Push to Gitea registry
        if: steps.filter.outputs.changed == 'true' && steps.registry.outputs.push == 'true'
        run: |
          img="${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.owner }}/channelhoarder"
          docker tag channelhoarder:latest "$img:latest"
          docker push "$img:latest"
          if [ "${{ steps.registry.outputs.newver }}" = "true" ]; then
            # Re-check right before pushing: an overlapping run may have published it.
            if docker manifest inspect --insecure "$img:v${{ steps.meta.outputs.ver }}" >/dev/null 2>&1; then
              echo "$img:v${{ steps.meta.outputs.ver }} already published - left as is"
            else
              docker tag channelhoarder:latest "$img:v${{ steps.meta.outputs.ver }}"
              docker push "$img:v${{ steps.meta.outputs.ver }}"
            fi
          fi

      - name: Log out of Gitea registry
        if: always() && steps.filter.outputs.changed == 'true' && steps.registry.outputs.push == 'true'
        run: docker logout "${{ steps.meta.outputs.registry }}"

      # Keep channelhoarder:latest in the host's image store; drop the
      # registry-named tags so they don't pile up there.
      - name: Remove run tags
        if: always() && steps.filter.outputs.changed == 'true'
        run: |
          img="${{ steps.meta.outputs.registry }}/${{ steps.meta.outputs.owner }}/channelhoarder"
          for ref in "$img:latest" "$img:v${{ steps.meta.outputs.ver }}"; do
            docker rmi "$ref" >/dev/null 2>&1 || true
          done
